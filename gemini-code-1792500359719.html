<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DC Pagos · DC Modas</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b0b0b">
    <style>
        :root {
            --bg-color: #0b0b0b;
            --card-bg: #141414;
            --gold: #d4af37;
            --gold-hover: #e6c547;
            --text-main: #f5f5f5;
            --text-muted: #a0a0a0;
            --border-color: #262626;
            --danger: #ff4d4d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 16px;
            padding-bottom: 90px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            margin-bottom: 20px;
        }

        .brand-info h1 {
            font-size: 20px;
            color: var(--gold);
            letter-spacing: 1px;
        }

        .brand-info p {
            font-size: 12px;
            color: var(--text-muted);
        }

        .admin-btn {
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
        }

        .admin-btn:hover {
            background: var(--gold);
            color: #000;
        }

        h2 {
            font-size: 16px;
            color: var(--gold);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }

        /* Panel de Administrador (Oculto por defecto) */
        #admin-panel {
            display: none;
            border-color: var(--gold);
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            background: #1f1f1f;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 8px;
            font-size: 14px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--gold);
        }

        .tallas-selector {
            display: flex;
            gap: 8px;
            margin-top: 6px;
        }

        .talla-chip {
            background: #1f1f1f;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
        }

        .talla-chip.selected {
            background: var(--gold);
            color: #000;
            font-weight: bold;
            border-color: var(--gold);
        }

        .btn-primary {
            width: 100%;
            background: var(--gold);
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }

        .btn-primary:hover {
            background: var(--gold-hover);
        }

        /* Catálogo de Productos */
        .grid-productos {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .producto-item {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .producto-info h3 {
            font-size: 15px;
            margin-bottom: 4px;
        }

        .producto-info .precio {
            color: var(--gold);
            font-weight: bold;
            font-size: 14px;
        }

        .producto-info .tallas-disponibles {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .acciones-producto {
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: flex-end;
        }

        select.select-talla-small {
            width: 80px;
            padding: 4px;
            font-size: 12px;
        }

        .btn-add {
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
        }

        .btn-add:hover {
            background: var(--gold);
            color: #000;
        }

        /* Carrito flotante / inferior */
        .carrito-container {
            margin-top: 20px;
            border-top: 1px solid var(--border-color);
            padding-top: 16px;
        }

        .carrito-lista {
            max-height: 150px;
            overflow-y: auto;
            margin-bottom: 10px;
        }

        .carrito-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            padding: 4px 0;
            border-bottom: 1px dashed var(--border-color);
        }

        .total-box {
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: bold;
            color: var(--gold);
            margin: 12px 0;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-info">
            <h1>DC PAGOS</h1>
            <p>Caja digital · DC Modas (Uruguay)</p>
        </div>
        <button class="admin-btn" onclick="toggleAdmin()">Admin</button>
    </header>

    <!-- PANEL DE ADMINISTRADOR (OCULTO) -->
    <div id="admin-panel" class="card">
        <h2>Panel de Administración (Nuevas Prendas)</h2>
        <div class="form-group">
            <label>Nombre de la prenda</label>
            <input type="text" id="nuevoNombre" placeholder="Ej.: Camisa de Lino Elegante">
        </div>
        <div class="form-group">
            <label>Precio ($ UYU)</label>
            <input type="number" id="nuevoPrecio" placeholder="1290">
        </div>
        <div class="form-group">
            <label>Tallas disponibles (Selecciona las habilitadas)</label>
            <div class="tallas-selector" id="selectorTallasAdmin">
                <div class="talla-chip" onclick="toggleTallaChip(this)">S</div>
                <div class="talla-chip" onclick="toggleTallaChip(this)">M</div>
                <div class="talla-chip" onclick="toggleTallaChip(this)">L</div>
                <div class="talla-chip" onclick="toggleTallaChip(this)">XL</div>
                <div class="talla-chip" onclick="toggleTallaChip(this)">Única</div>
            </div>
        </div>
        <button class="btn-primary" onclick="publicarPrenda()">Publicar al Catálogo</button>
    </div>

    <!-- CATÁLOGO PÚBLICO -->
    <div class="card">
        <h2>Catálogo de Ropa</h2>
        <div id="listaCatalogo" class="grid-productos">
            <!-- Los productos se cargan dinámicamente aquí -->
        </div>
    </div>

    <!-- CARRITO Y COBRO -->
    <div class="card carrito-container">
        <h2>Nueva Venta / Carrito</h2>
        <div id="listaCarrito" class="carrito-lista">
            <p style="color: var(--text-muted); font-size: 13px;">No hay productos añadidos.</p>
        </div>
        <div class="total-box">
            <span>Total:</span>
            <span id="totalVenta">UYU 0,00</span>
        </div>
        <button class="btn-primary" onclick="iniciarCobro()">Cobrar Venta</button>
    </div>

    <script>
        // Base de datos inicial de productos
        let catalogo = [
            { id: 1, nombre: "Remera básica", precio: 590, tallas: ["S", "M", "L", "XL"] },
            { id: 2, nombre: "Pantalón Denim", precio: 990, tallas: ["M", "L"] },
            { id: 3, nombre: "Championes Urbano", precio: 1490, tallas: ["38", "39", "40", "41"] }
        ];

        let carrito = [];
        let tallasSeleccionadasAdmin = [];

        // Habilitar / Deshabilitar Panel Admin con clave de seguridad simple
        function toggleAdmin() {
            const panel = document.getElementById('admin-panel');
            if (panel.style.display === 'block') {
                panel.style.display = 'none';
            } else {
                let pin = prompt("Ingrese contraseña de Administrador:");
                if (pin === "1234") { // Puedes cambiar tu clave aquí
                    panel.style.display = 'block';
                } else if (pin !== null) {
                    alert("Contraseña incorrecta");
                }
            }
        }

        function toggleTallaChip(el) {
            el.classList.toggle('selected');
            const talla = el.innerText;
            if (tallasSeleccionadasAdmin.includes(talla)) {
                tallasSeleccionadasAdmin = tallasSeleccionadasAdmin.filter(t => t !== talla);
            } else {
                tallasSeleccionadasAdmin.push(talla);
            }
        }

        function publicarPrenda() {
            const nombre = document.getElementById('nuevoNombre').value;
            const precio = parseFloat(document.getElementById('nuevoPrecio').value);

            if (!nombre || isNaN(precio) || tallasSeleccionadasAdmin.length === 0) {
                alert("Por favor complete todos los datos y seleccione al menos una talla.");
                return;
            }

            const nuevoProducto = {
                id: Date.now(),
                nombre: nombre,
                precio: precio,
                tallas: [...tallasSeleccionadasAdmin]
            };

            catalogo.unshift(nuevoProducto); // Agrega al inicio (lo más nuevo del día)
            guardarDatos();
            renderCatalogo();

            // Limpiar formulario
            document.getElementById('nuevoNombre').value = '';
            document.getElementById('nuevoPrecio').value = '';
            document.querySelectorAll('.talla-chip').forEach(c => c.classList.remove('selected'));
            tallasSeleccionadasAdmin = [];
            document.getElementById('admin-panel').style.display = 'none';
            alert("¡Prenda publicada con éxito en DC Modas!");
        }

        function renderCatalogo() {
            const container = document.getElementById('listaCatalogo');
            container.innerHTML = '';

            if (catalogo.length === 0) {
                container.innerHTML = '<p style="color:var(--text-muted); font-size:13px;">No hay prendas publicadas.</p>';
                return;
            }

            catalogo.forEach(item => {
                let optionsTallas = item.tallas.map(t => `<option value="${t}">${t}</option>`).join('');
                
                const div = document.createElement('div');
                div.className = 'producto-item';
                div.innerHTML = `
                    <div class="producto-info">
                        <h3>${item.nombre}</h3>
                        <div class="precio">UYU $${item.precio.toLocaleString()}</div>
                        <div class="tallas-disponibles">Tallas: ${item.tallas.join(', ')}</div>
                    </div>
                    <div class="acciones-producto">
                        <select id="talla-sel-${item.id}" class="select-talla-small">
                            ${optionsTallas}
                        </select>
                        <button class="btn-add" onclick="agregarAlCarrito(${item.id})">Añadir</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function agregarAlCarrito(id) {
            const producto = catalogo.find(p => p.id === id);
            const selectTalla = document.getElementById(`talla-sel-${id}`);
            const tallaElegida = selectTalla ? selectTalla.value : "Única";

            carrito.push({
                nombre: producto.nombre,
                precio: producto.precio,
                talla: tallaElegida
            });

            renderCarrito();
        }

        function renderCarrito() {
            const container = document.getElementById('listaCarrito');
            const totalBox = document.getElementById('totalVenta');
            container.innerHTML = '';

            if (carrito.length === 0) {
                container.innerHTML = '<p style="color: var(--text-muted); font-size: 13px;">No hay productos añadidos.</p>';
                totalBox.innerText = 'UYU 0,00';
                return;
            }

            let total = 0;
            carrito.forEach((item, index) => {
                total += item.precio;
                const row = document.div;
                const div = document.createElement('div');
                div.className = 'carrito-row';
                div.innerHTML = `
                    <span>${item.nombre} (Talla: ${item.talla})</span>
                    <span>UYU $${item.precio.toLocaleString()}</span>
                `;
                container.appendChild(div);
            });

            totalBox.innerText = `UYU $${total.toLocaleString()}`;
        }

        function iniciarCobro() {
            if (carrito.length === 0) {
                alert("El carrito está vacío. Añade prendas para cobrar.");
                return;
            }
            let total = carrito.reduce((acc, item) => acc + item.precio, 0);
            alert(`Iniciando cobro por UYU $${total.toLocaleString()} para DC Modas.`);
            // Aquí puedes integrar la pasarela o limpieza posterior
            carrito = [];
            renderCarrito();
        }

        function guardarDatos() {
            localStorage.setItem('dc_catalogo', JSON.stringify(catalogo));
        }

        function cargarDatos() {
            const saved = localStorage.getItem('dc_catalogo');
            if (saved) {
                catalogo = JSON.parse(saved);
            }
        }

        // Inicializar app
        cargarDatos();
        renderCatalogo();
    </script>
</body>
</html>
